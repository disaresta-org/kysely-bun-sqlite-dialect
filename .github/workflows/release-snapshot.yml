name: Snapshot Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for OIDC trusted publishing

jobs:
  snapshot:
    name: Snapshot Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Only needed to publish: changesets shells out to the npm CLI, and
      # npm >= 11.5.1 is what implements OIDC trusted publishing. Everything
      # else in this workflow runs on bun (see bunfig.toml).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json  # reads engines.node

      - name: Prepare npm for OIDC
        run: |
          echo "npm version: $(npm --version)"
          rm -f ~/.npmrc

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Run type checking
        run: bun run verify-types

      - name: Run linting
        run: bun run lint

      - name: Create Snapshot Release
        run: |
          bun run version-packages -- --snapshot "${{ github.ref_name }}"
          echo '---'
          echo 'Detected Changes:'
          git diff
          echo '---'
          bun run release -- --tag "${{ github.ref_name }}" --no-git-tag
