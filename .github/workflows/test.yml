name: Test

on:
  pull_request:

jobs:
  test:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json


      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Run Package Tests
        run: bun run test

  peer-floor:
    name: Testing against the kysely peer floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # peerDependencies declares the oldest kysely this dialect supports, but
      # the suite otherwise only ever runs against the pinned devDependency. So
      # install the declared floor and run everything against it too.
      - name: Resolve the declared peer floor
        id: floor
        run: echo "version=$(bun scripts/peer-floor.ts kysely)" >> "$GITHUB_OUTPUT"

      - name: Install the peer floor
        run: bun add -d kysely@${{ steps.floor.outputs.version }}

      - name: Run type checking
        run: bun run verify-types

      - name: Run Package Tests
        run: bun test
