pre-commit:
  parallel: true
  commands:
    "lint and format staged files":
      run: turbo lint:staged
      stage_fixed: true
    "check package.json files":
      run: bun run syncpack:format && bun run lint:packages
      stage_fixed: true
    "[repo] verify types":
      run: turbo verify-types
      tags:
        - types

pre-push:
  parallel: true
  commands:
    "[repo] lint and format files":
      run: turbo lint
      tags:
        - lint

commit-msg:
  commands:
    "lint commit message":
      run: bun run commitlint --edit {1}
